<template id="documentoTemplate">
    <article class="document-card document-subform" data-document-card>
        <input type="hidden" data-doc-field="idDocumentoPostulante">

        <div class="document-card-header">
            <div>
                <span class="document-kicker">Formulario de documento <strong data-document-number>1</strong></span>
                <h3 data-document-title>Documento académico</h3>
                <p>Cada bloque registra un PDF independiente con su información académica.</p>
            </div>
            <button type="button" class="btn-remove-document" data-remove-document>Quitar formulario</button>
        </div>

        <div class="form-grid two-columns document-form-grid">
            <div class="form-group full-row">
                <label>Archivo PDF</label>
                <input type="file" accept=".pdf,application/pdf" data-doc-field="archivoDocumento">
                <small data-current-file>Solo PDF. Tamaño máximo: 5 MB.</small>
            </div>
            <div class="form-group full-row">
                <label>Título del documento</label>
                <input type="text" maxlength="100" required data-doc-field="tituloDocumento">
            </div>
            <div class="form-group">
                <label>Tipo / grado</label>
                <select required data-doc-field="slctGradoEstudio" data-catalog="gradosDocumento" data-value="idGradoEst" data-label="nombreGradoEst">
                    <option value="" disabled selected>Seleccione</option>
                </select>
            </div>
            <div class="form-group">
                <label>Institución educativa</label>
                <select required data-doc-field="slctInstitucionEducativa" data-catalog="instituciones" data-value="idInstitucion" data-label="nombreInstitucion">
                    <option value="" disabled selected>Seleccione</option>
                </select>
            </div>
            <div class="form-group">
                <label>Otra institución</label>
                <input type="text" maxlength="250" disabled data-doc-field="nombreOtraInstitucion">
            </div>
            <div class="form-group">
                <label>Provincia del documento</label>
                <select required data-doc-field="provinciaDocumento" data-catalog="provincias" data-value="codigo_provincia" data-label="nombre_provincia">
                    <option value="" disabled selected>Seleccione</option>
                </select>
            </div>
            <div class="form-group">
                <label>Total de horas</label>
                <input type="number" min="40" step="1" required data-doc-field="horasTotales">
            </div>
            <div class="form-group">
                <label>Fecha de inicio</label>
                <input type="date" required data-doc-field="fechaInicioEstudios">
            </div>
            <div class="form-group">
                <label>Fecha de finalización</label>
                <input type="date" required data-doc-field="fechaFinEstudios">
            </div>
            <div class="form-group">
                <label>Fecha de emisión</label>
                <input type="date" required data-doc-field="fechaEmision">
            </div>
        </div>
    </article>
</template>
