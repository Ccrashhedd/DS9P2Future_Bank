<section class="application-section section-shell">
    <div class="container application-grid">
        <div class="application-copy reveal-on-load">
            <span class="eyebrow">Solicitud bancaria</span>
            <h1>Completa tu postulación inicial</h1>
            <p>Este formulario sirve como vista base para registrar una solicitud de cuenta o producto bancario. Luego puedes conectarlo con tu backend PHP y tus tablas de base de datos.</p>

            <div class="mini-stats">
                <div><strong>3</strong><span>minutos estimados</span></div>
                <div><strong>4</strong><span>datos principales</span></div>
            </div>
        </div>

        <form class="bank-form application-form reveal-on-load" id="postulacionForm" method="post" action="../Backend/PHP/controller/postulacion.php">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombreCompleto">Nombre completo</label>
                    <input type="text" id="nombreCompleto" name="nombreCompleto" placeholder="Nombre y apellido" required>
                </div>
                <div class="form-group">
                    <label for="cedula">Cédula</label>
                    <input type="text" id="cedula" name="cedula" placeholder="8-000-0000" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="6000-0000" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="producto">Producto solicitado</label>
                    <select id="producto" name="producto" required>
                        <option value="">Selecciona una opción</option>
                        <option value="cuenta-ahorro">Cuenta de ahorro</option>
                        <option value="cuenta-corriente">Cuenta corriente</option>
                        <option value="tarjeta-credito">Tarjeta de crédito</option>
                        <option value="prestamo-personal">Préstamo personal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ingresoMensual">Ingreso mensual aproximado</label>
                    <input type="number" id="ingresoMensual" name="ingresoMensual" placeholder="Ej. 1200" min="0" step="0.01">
                </div>
            </div>

            <div class="form-group">
                <label for="comentario">Comentario adicional</label>
                <textarea id="comentario" name="comentario" rows="4" placeholder="Describe brevemente el motivo de tu solicitud"></textarea>
            </div>

            <label class="check-line">
                <input type="checkbox" name="aceptaTerminos" required>
                <span>Acepto que mis datos sean usados para evaluar esta solicitud académica.</span>
            </label>

            <button type="submit" class="btn btn-bank-primary w-100">Enviar solicitud</button>
        </form>
    </div>
</section>
